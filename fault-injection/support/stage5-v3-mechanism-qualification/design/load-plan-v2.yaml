  control_concurrency_per_stream: {image_asset: 2, product_detail: 4, cart_view: 4}
  max_added_node_cpu_cores: 0.25
network_path:
  candidate: NETWORK_PATH/k8s-worker3/k8s-worker2
  target_business_edge: checkout->cart
  current_route_and_packet_proof_required: true
  prefault_target_edge_successful_requests_per_minute_min: 30
  prefault_target_edge_usable_spans_per_minute_min: 30
