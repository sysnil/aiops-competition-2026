  alternate_candidate: frontend_worker1_to_product-catalog_worker3
  cart_view_observational_only: true
  minimum_successful_requests_per_minute_each_phase: 30
  minimum_valid_edge_spans_per_minute_each_phase: 30
  maximum_client_p95_ratio: 1.25
probe:
