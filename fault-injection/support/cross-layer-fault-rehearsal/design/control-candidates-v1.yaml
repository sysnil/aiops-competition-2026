  min_before_trace_spans: 30
  min_during_trace_spans: 30
  normality_p95_during_over_before_max: 1.25
  normality_error_rate_increase_max: 0.02
  pod_identity_required_for_multi_replica_source: true
  no_post_fault_substitution: true
  no_eligible_control_means_invalid_future_case: true
candidates:
