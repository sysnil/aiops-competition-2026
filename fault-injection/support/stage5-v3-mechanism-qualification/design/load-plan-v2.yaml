  destination: k8s-worker2
  interval_seconds: 5
  before_samples: 120
  during_samples: 60
  after_samples: 120
  minimum_valid_before_after: 108
  minimum_valid_during: 54
  maximum_consecutive_invalid: 2
  per_sample_timeout_seconds: 4
  timeout_or_miss_value: null
capture:
  trace_source: JAEGER_OPENSEARCH_STORAGE
  phase_start_delay_seconds: 20
  trace_completion_delay_seconds: 60
  maximum_capture_start_lag_seconds: 120
