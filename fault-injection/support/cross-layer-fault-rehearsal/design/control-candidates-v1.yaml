    source_node: k8s-worker2
    destination_node: k8s-worker2
    role: same_source_local_control
    caveat: source_process_shared_with_affected_frontend_call
  - edge: shipping->quote
    source_node: k8s-worker1
    destination_node: k8s-worker1
    role: independent_service_local_control
    caveat: natural_request_volume_may_be_insufficient
  - edge: checkout->currency
    source_node: k8s-worker3
    destination_node: k8s-worker3
    role: independent_local_control
    caveat: upstream_checkout_traffic_may_propagate_network_delay
  - edge: frontend->cart
    source_node: k8s-worker2
    destination_node: k8s-worker2
