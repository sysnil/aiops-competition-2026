source: independent_rehearsal
formal_case: false
reference_machine: copied_verified_phase4_workload_state_machine
workload:
  machine: /root/stage5-v3-mechanism-qualification/design/workload-state-machine-v2.yaml
  profile: MEDIUM
  duration_seconds: 1500
  before_seconds: 600
  during_seconds: 300
  after_seconds: 600
  workflow_weights: {browse: 20, shopping: 30, checkout: 50}
  control_streams:
    - {name: image_asset, operation: GET /images/products/OpticalTubeAssembly.jpg, rate_per_second: 1.0, seed_offset: 101}
    - {name: product_detail, operation: GET /api/products/2ZYFJ3GM2N, rate_per_second: 2.0, seed_offset: 102}
    - {name: cart_view, operation: GET /api/cart, rate_per_second: 2.0, seed_offset: 103}
