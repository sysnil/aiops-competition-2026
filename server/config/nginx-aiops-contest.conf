limit_req_zone $binary_remote_addr zone=aiops_public_per_ip:10m rate=1200r/m;

server {
    listen 192.168.51.51:8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/aiops-contest-access.log combined;
    error_log /var/log/nginx/aiops-contest-error.log warn;

    location ~ "^/v1/final/(?:tasks/(?:FT-0[1-3]|PK-R0[1-8])|pk/rounds/PK-R0[1-8])/submissions$" {
        limit_except POST { deny all; }
        client_max_body_size 3m;
        limit_req zone=aiops_public_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
        proxy_buffering on;
    }

    location ~ "^/v1/(?:practice|semifinal)/submissions/qa$" {
        limit_except POST { deny all; }
        client_max_body_size 3m;
        limit_req zone=aiops_public_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;
        proxy_buffering on;
    }

    location ~ "^/v1/(?:(?:practice|semifinal)/)?submissions$" {
        limit_except POST { deny all; }
        client_max_body_size 128k;
        limit_req zone=aiops_public_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;
        proxy_buffering on;
    }

    location ~ "^/v1/(?:(?:practice|semifinal)/)?submissions/SUB-[A-F0-9]{20}$" {
        limit_except GET { deny all; }
        limit_req zone=aiops_public_per_ip burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_buffering on;
    }

    location / {
        limit_except GET { deny all; }
        limit_req zone=aiops_public_per_ip burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_buffering on;
    }
}
